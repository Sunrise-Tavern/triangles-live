# Triangles live engine -- the file the rig runs from.
#
#   ./live.sh serve                     uses this file
#   ./live.sh serve --fps 30            overrides one value for this run
#   ./live.sh doctor                    checks all of it before the doors open
#
# A command-line flag beats this file; this file beats the built-in default.

[output]
# "auto" = send to every DDP controller in xlights_networks.xml, each getting
# the slice of the show it owns.  The rig is two Falcons -- nets on
# 192.168.1.20, corridor on 192.168.1.30 -- so one address cannot cover it.
# A literal address sends the whole show to that one receiver instead, which is
# what a bench test or the fake Falcon wants.  Empty renders without sending
# anything: still the right setting on a laptop.
host = "auto"
# host = "127.0.0.1"          # everything at a fake Falcon on this machine
port = 4048
# Clip output to a single controller, for testing one in isolation.  Empty
# with host = "auto" means all of them.  Run `./live.sh layout` to see who owns
# what: Falcon_F16V5_0E1C is the nets, Falcon_F16V5_8928 the corridor.
controller = ""
fps = 40.0

[audio]
# Input device index or name.  Empty = system default.
# Run `./live.sh listen --devices` at the rig to find the USB interface.
# The name, not the index: indices move when a device enumerates differently
# after a reboot or a replug, and the systemd unit has no one to notice.
device = "Onyx Artist"
# Or drive the show from a file instead of the line input, for testing:
file = ""
loop = false
# The DJ's level drifts across a set and every threshold downstream is
# relative, so this is on by default at the rig.
autogain = true
backend = "aubio"
# On a slow machine, turn [output] fps down FIRST -- it costs nothing (the
# offline show has always rendered at 20 fps).  These two are a last resort:
# blocksize 1024 halves the analysis cost but takes beats-within-30ms from
# 100% to 68%, and window 1024 from 100% to 50%.
blocksize = 512
window = 2048
# Level below which nothing is playing, dBFS.  This is the one absolute number
# in the analysis, because "silence" depends entirely on the input: a line feed
# with nothing on it sits near -90 dBFS, a room microphone near -51.
#   -70  a line feed from the XR16 (the rig)
#   -45  a room mic, or Spotify captured through a loopback with room noise
#   -100 switches the idle state off entirely -- the right answer for a room
#        mic, where the noise floor is only a few dB below quiet music and no
#        threshold can separate them
# Run `./live.sh doctor` with nothing playing and it will tell you what to set.
silence_dbfs = -70.0

[web]
bind = "0.0.0.0"
port = 8080
# 0 = match the engine's frame rate.  Turn down for a phone on bad wifi.
preview_fps = 0.0
preview_detail = 1.0

[show]
brightness = 1.0
gamma = 1.0
# Shift the lights against the PA; positive fires later.  Measure at the rig.
latency_ms = 0.0
# Preset to load at startup, by name.
preset = ""
# Start dark, so a restart mid-set doesn't throw light unannounced.
blackout_on_start = false
# Gestures that lead with one group of triangles rest the other.  How bright
# the resting group's slow plasma is; 0 holds the bed wash instead (frozen
# for a bar or a phrase while the corridor keeps moving, as the offline show).
rest_level = 0.4

[log]
file = "logs/live.log"
level = "info"
max_bytes = 8388608
keep = 3
